<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 90" width="100%" height="100%">
  <defs>
    <linearGradient id="levGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4FF00" />
      <stop offset="100%" stop-color="#A3E635" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
  </defs>
  
  <!-- Icon Symbol: Geometric Dynamic Peak / Wolf Spirit Shield -->
  <g transform="translate(10, 5)">
    <!-- Shield / Peak Base -->
    <path d="M 40 5 L 75 22 L 68 62 L 40 78 L 12 62 L 5 22 Z" fill="url(#shieldGrad)" stroke="#334155" stroke-width="2.5" />
    <!-- Dynamic Lightning / Spirit Slash -->
    <path d="M 40 12 L 60 25 L 44 46 L 62 48 L 26 73 L 34 49 L 18 47 Z" fill="url(#levGrad)" />
    <!-- Glow point -->
    <circle cx="40" cy="12" r="2.5" fill="#FFFFFF" />
  </g>

  <!-- Brand Typography -->
  <g transform="translate(95, 0)">
    <!-- LEV Title -->
    <text x="0" y="48" font-family="'Outfit', 'Montserrat', 'Arial Black', sans-serif" font-size="44" font-weight="900" letter-spacing="4" fill="#FFFFFF">
      LEV
    </text>
    <!-- Accent Line -->
    <rect x="100" y="24" width="6" height="24" rx="3" fill="#D4FF00" />
    
    <!-- WILD SPIRIT Subtitle -->
    <text x="114" y="44" font-family="'Outfit', 'Inter', sans-serif" font-size="20" font-weight="800" letter-spacing="6" fill="#D4FF00">
      WILD SPIRIT
    </text>
    
    <!-- Tagline: ATHLETIC & OUTDOOR GEAR -->
    <text x="2" y="70" font-family="'Inter', sans-serif" font-size="10.5" font-weight="700" letter-spacing="3" fill="#94A3B8">
      EQUIPAMIENTO DEPORTIVO &bull; CICLISMO &bull; GYM &bull; ESCALADA
    </text>
  </g>
</svg>
